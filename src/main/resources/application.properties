server.port=8080

# ---- PostgreSQL (local) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Silva_Naya}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dar_es_Salaam
spring.jackson.time-zone=Africa/Dar_es_Salaam

# ---- JWT (dev tu, production tumia JWT_SECRET kwenye Render) ----
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-characters-long-1234}
app.jwt.expiration-hours=12

# ---- CORS (React) ----
app.cors.origins=${FRONTEND_URL:http://localhost:3000}

# ---- Admin wa kwanza (unatumika tu kama hakuna user yeyote) ----
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:admin@silvanaya.co.tz}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}