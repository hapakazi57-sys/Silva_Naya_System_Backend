# ==========================================
# Inatumika kwenye Render (SPRING_PROFILES_ACTIVE=prod)
# Values nyeti zote zinatoka Environment Variables
# ==========================================

# ---- Database (Neon Postgres) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Deploy ya kwanza weka DDL_AUTO=update kwenye Render, kisha uondoe (irudi validate)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dar_es_Salaam
spring.jackson.time-zone=Africa/Dar_es_Salaam

# ---- Connection Pool ----
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ---- Server ----
server.port=${PORT:8080}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=12

# ---- CORS: URL ya Vercel (bila slash mwishoni) ----
app.cors.origins=${FRONTEND_URL}

# ---- Admin wa kwanza (unatengenezwa mara moja tu) ----
app.bootstrap.admin-email=${APP_ADMIN_EMAIL}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD}

# ---- Actuator ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never